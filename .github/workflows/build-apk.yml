name: APK olustur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Zip'i ac ve APK derle
        run: |
          unzip -o SigaraSayaci-proje.zip
          cd SigaraSayaci
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SigaraSayaci.apk

      - name: APK'yi Releases sayfasina koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sigara Sayaci ${{ github.run_number }}
          files: SigaraSayaci.apk
