name: APK olustur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Zip'i ac ve APK derle
        shell: bash
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            unzip -o SigaraSayaci-proje.zip
            cd SigaraSayaci
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../SigaraSayaci.apk
          } 2>&1 | tee build.log

      - name: Hata ozeti
        if: failure()
        shell: bash
        run: |
          {
            echo "## Hata kaydi (son 60 satir)"
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "build.log yok: hata derlemeden once olustu"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yi Releases sayfasina koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sigara Sayaci ${{ github.run_number }}
          files: SigaraSayaci.apk
